name: Verify Spartan static site
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify complete release and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s manifest.webmanifest
          test -s sw.js
          test -f .nojekyll
          test -s icons/icon-192.png
          test -s icons/icon-512.png
          node --check sw.js
          python3 - <<'PY'
          import json, pathlib, re, struct, subprocess, tempfile
          root=pathlib.Path('.')
          manifest=json.loads((root/'manifest.webmanifest').read_text())
          assert manifest['display']=='standalone'
          assert manifest['start_url']=='./'
          html=(root/'index.html').read_text()
          assert 'manifest.webmanifest' in html
          assert 'sw.js' in html
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
          assert scripts, 'No inline scripts found'
          for i,script in enumerate(scripts):
              with tempfile.NamedTemporaryFile(mode='w',suffix='.js') as f:
                  f.write(script);f.flush()
                  subprocess.run(['node','--check',f.name],check=True)
          for icon in manifest['icons']:
              p=root/icon['src']
              assert p.is_file(), f'Missing icon: {p}'
              data=p.read_bytes()
              assert data[:8]==b'\x89PNG\r\n\x1a\n', f'Invalid PNG: {p}'
              width,height=struct.unpack('>II',data[16:24])
              expected=int(icon['sizes'].split('x')[0])
              assert (width,height)==(expected,expected), f'Wrong PNG dimensions: {p}'
          sw=(root/'sw.js').read_text()
          assert 'index.html' in sw and 'manifest.webmanifest' in sw
          # Ensure the offline shell lists the files needed to reopen the app.
          for required in ('index.html','manifest.webmanifest','icons/icon-192.png','icons/icon-512.png'):
              assert required in sw, f'Offline cache missing: {required}'
          # Prevent accidentally publishing locally exported workout data.
          prohibited=list(root.glob('**/*backup*.json')) + list(root.glob('**/*workout*.csv'))
          assert not prohibited, f'Private export-like files must not be published: {prohibited}'
          print(f'PASS: {len(scripts)} inline scripts, manifest, PNG icons, offline assets, privacy guard')
          PY
