name: Verify Spartan static site
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required public files
        run: |
          set -eu
          test -s index.html
          test -s manifest.webmanifest
          test -s sw.js
          test -f .nojekyll
          test -s icons/icon-192.png
          test -s icons/icon-512.png
          python3 -m json.tool manifest.webmanifest >/dev/null
          python3 - <<'PY'
          import json,pathlib
          manifest=json.loads(pathlib.Path("manifest.webmanifest").read_text())
          assert manifest["display"]=="standalone"
          for icon in manifest["icons"]:
              assert pathlib.Path(icon["src"]).is_file(), icon["src"]
          html=pathlib.Path("index.html").read_text()
          assert 'manifest.webmanifest' in html
          assert 'sw.js' in html
          print("Spartan static site checks passed")
          PY
